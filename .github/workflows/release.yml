name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Resolve Version and Execution Mode
        id: version_check
        run: |
          # Extract versionName from app/build.gradle.kts
          APP_VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "App versionName detected: ${APP_VERSION}"

          EXPECTED_TAG="v${APP_VERSION}"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "${TAG}" != "${EXPECTED_TAG}" ]; then
              echo "::error::Tag mismatch! Pushed tag '${TAG}' does not match app versionName 'v${APP_VERSION}'."
              exit 1
            fi
            IS_RELEASE="true"
            echo "Mode: Production Tag Release (${TAG})"
          else
            TAG="${EXPECTED_TAG}"
            IS_RELEASE="false"
            echo "Mode: Manual Verification Build (No release will be published)"
          fi

          TITLE="TW Market Ledger ${TAG}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Decode Android Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is empty or not configured!"
            exit 1
          fi
          KEYSTORE_PATH="/tmp/release-keystore-$$.jks"
          echo "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          echo "keystore_path=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon openApiValidate openApiGenerate :app:assembleRelease

      - name: Verify Signed APK with apksigner
        id: verify_apk
        env:
          EXPECTED_FINGERPRINT: "12:F6:72:BE:0C:FF:44:68:D0:D8:A1:D3:54:73:DB:B5:D6:45:B5:C6:48:66:D9:6B:DB:5A:3E:9F:CF:DC:C6:92"
          TAG: ${{ steps.version_check.outputs.tag }}
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${APK_PATH}" ]; then
            echo "::error::Expected signed APK '${APK_PATH}' not found! (Unsigned artifact was produced instead)."
            exit 1
          fi

          echo "==> Verifying signature of ${APK_PATH} with apksigner..."
          apksigner verify --verbose --print-certs "${APK_PATH}" > /tmp/apksigner_output.txt
          cat /tmp/apksigner_output.txt

          if ! grep -qi "Verifies" /tmp/apksigner_output.txt; then
            echo "::error::apksigner verification failed! APK is not properly signed."
            exit 1
          fi

          echo "==> Verifying Signer SHA-256 Digest..."
          EXPECTED_COMPACT=$(echo "${EXPECTED_FINGERPRINT}" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          ACTUAL_DIGESTS=$(grep -i "Signer #1 certificate SHA-256 digest" /tmp/apksigner_output.txt | awk '{print $NF}' | tr -d ':' | tr '[:upper:]' '[:lower:]')

          echo "Expected digest (compact): ${EXPECTED_COMPACT}"
          echo "Actual digest   (compact): ${ACTUAL_DIGESTS}"

          if [ "${ACTUAL_DIGESTS}" != "${EXPECTED_COMPACT}" ]; then
            echo "::error::Signer SHA-256 certificate fingerprint mismatch!"
            exit 1
          fi

          echo "==> Fingerprint verified successfully."

          RELEASE_ASSET_NAME="tw-market-ledger-${TAG}.apk"
          cp "${APK_PATH}" "${RELEASE_ASSET_NAME}"
          echo "asset_path=${RELEASE_ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Signed Verification Artifact
        if: steps.version_check.outputs.is_release == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: tw-market-ledger-signed-verification-${{ steps.version_check.outputs.tag }}
          path: android-app/${{ steps.verify_apk.outputs.asset_path }}
          retention-days: 7
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.version_check.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version_check.outputs.tag }}
          TITLE: ${{ steps.version_check.outputs.title }}
          ASSET_PATH: ${{ steps.verify_apk.outputs.asset_path }}
        run: |
          echo "==> Publishing official GitHub release for verified existing tag '${TAG_NAME}'..."
          gh release create "${TAG_NAME}" "${ASSET_PATH}" \
            --verify-tag \
            --title "${TITLE}" \
            --notes "Production release of TW Market Ledger ${TAG_NAME}. Digitally signed and configured for production API (${TITLE})."

      - name: Cleanup Keystore Material
        if: always()
        run: |
          if [ -n "${{ steps.keystore.outputs.keystore_path }}" ] && [ -f "${{ steps.keystore.outputs.keystore_path }}" ]; then
            shred -u "${{ steps.keystore.outputs.keystore_path }}" 2>/dev/null || rm -f "${{ steps.keystore.outputs.keystore_path }}"
            echo "Temporary keystore securely wiped."
          fi
          rm -f /tmp/apksigner_output.txt
