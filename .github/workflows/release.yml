name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        type: string
        description: "Tag name for the release"
        required: false
        default: "dev-build"
      release_title:
        type: string
        description: "Release Title"
        required: false
        default: "TW Market Ledger — Development Build"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Build Debug APK
        run: ./gradlew --no-daemon openApiValidate openApiGenerate :app:assembleDebug
      - name: Prepare APK Asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tw-market-ledger-debug.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
          TITLE: ${{ inputs.release_title }}
        run: |
          gh release create "$TAG_NAME" tw-market-ledger-debug.apk \
            --title "$TITLE" \
            --notes "Development build of TW Market Ledger. Signed with debug key for testing. External production feeds remain unconfigured." \
            --prerelease || \
          gh release upload "$TAG_NAME" tw-market-ledger-debug.apk --clobber
