services:
  postgres:
    image: postgres:16-alpine
    container_name: twml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-twstock}
      POSTGRES_USER: ${POSTGRES_USER:-twstock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ${TWML_DATA_ROOT:-/volume1/docker/tw-market-ledger}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twstock} -d ${POSTGRES_DB:-twstock}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - twml-network

  redis:
    image: redis:7-alpine
    container_name: twml-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    volumes:
      - ${TWML_DATA_ROOT:-/volume1/docker/tw-market-ledger}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 64M
    networks:
      - twml-network

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/wendell78064/tw_stock_android_spec-backend:latest}
    container_name: twml-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-TW Market Ledger API}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      SYNC_PAGE_LIMIT: ${SYNC_PAGE_LIMIT:-100}
      REALTIME_PROVIDER: ${REALTIME_PROVIDER:-}
      SHIOAJI_API_KEY: ${SHIOAJI_API_KEY:-}
      SHIOAJI_SECRET_KEY: ${SHIOAJI_SECRET_KEY:-}
      SHIOAJI_SIMULATION: ${SHIOAJI_SIMULATION:-true}
      P1_ALERT_REALTIME_ENABLED: ${P1_ALERT_REALTIME_ENABLED:-false}
      REALTIME_BROKER_SUBSCRIPTION_BUDGET: ${REALTIME_BROKER_SUBSCRIPTION_BUDGET:-}
    volumes:
      - ${TWML_DATA_ROOT:-/volume1/docker/tw-market-ledger}/temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M
    networks:
      - twml-network

networks:
  twml-network:
    name: twml-network
    driver: bridge
