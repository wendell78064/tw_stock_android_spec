openapi: 3.1.0
info:
  title: TW Market Ledger API
  version: 0.1.0
  description: Contract baseline for the Taiwan stock portfolio and market intelligence app.
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: Market
  - name: Securities
  - name: Futures
  - name: Industries
  - name: Portfolios
  - name: Watchlists
  - name: Alerts
  - name: Screeners
paths:
  /health:
    get:
      security: []
      summary: Liveness check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      security: []
      summary: Dependency readiness check
      responses:
        "200":
          description: PostgreSQL and Redis are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /market/overview:
    get:
      tags: [Market]
      summary: Get the market dashboard snapshot
      responses:
        "200":
          description: Market overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketOverviewEnvelope"
  /market/indexes:
    get:
      operationId: getMarketIndexes
      tags: [Market]
      responses:
        "200": { description: Latest TAIEX and OTC index records }
  /market/indexes/{indexCode}:
    get:
      operationId: getMarketIndex
      tags: [Market]
      parameters:
        - { in: path, name: indexCode, required: true, schema: { type: string } }
      responses:
        "200": { description: Latest market index }
        "404": { $ref: "#/components/responses/NotFound" }
  /market/indexes/{indexCode}/candles:
    get:
      operationId: getMarketIndexCandles
      tags: [Market]
      parameters:
        - { in: path, name: indexCode, required: true, schema: { type: string } }
        - { in: query, name: range, schema: { type: string, enum: [5D, 10D, 30D, 1Y, 5Y], default: 30D } }
      responses:
        "200": { description: Daily index candles }
  /market/breadth:
    get:
      operationId: getMarketBreadth
      tags: [Market]
      parameters:
        - { in: query, name: market, schema: { $ref: "#/components/schemas/MarketCode" } }
        - { in: query, name: date, schema: { type: string, format: date } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        "200": { description: Market breadth series }
  /market/institutional/spot:
    get:
      operationId: getMarketInstitutionalSpot
      tags: [Market]
      parameters:
        - { in: query, name: market, required: true, schema: { $ref: "#/components/schemas/MarketCode" } }
        - { $ref: "#/components/parameters/TradingWindow" }
        - { in: query, name: institution, schema: { $ref: "#/components/schemas/InstitutionType" } }
      responses:
        "200": { description: Market institutional spot series }
  /market/credit:
    get:
      operationId: getMarketCredit
      tags: [Market]
      parameters:
        - { in: query, name: market, required: true, schema: { $ref: "#/components/schemas/MarketCode" } }
        - { $ref: "#/components/parameters/TradingWindow" }
      responses:
        "200": { description: "Market margin, short and lending series" }
  /futures/products:
    get:
      operationId: getFuturesProducts
      tags: [Futures]
      responses:
        "200": { description: Supported TAIFEX futures products }
  /futures/products/{productCode}/overview:
    get:
      operationId: getFuturesOverview
      tags: [Futures]
      parameters:
        - { $ref: "#/components/parameters/FuturesProductCode" }
      responses:
        "200":
          description: Near and next contract overview with basis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FuturesOverviewEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /futures/products/{productCode}/contracts:
    get:
      operationId: getFuturesContracts
      tags: [Futures]
      parameters:
        - { $ref: "#/components/parameters/FuturesProductCode" }
      responses:
        "200": { description: Actual delivery-month contracts }
  /futures/contracts/{contractCode}/candles:
    get:
      operationId: getFuturesContractCandles
      tags: [Futures]
      parameters:
        - { in: path, name: contractCode, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/DerivativesRange" }
      responses:
        "200": { description: "Contract daily OHLC, volume and open interest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /futures/products/{productCode}/continuous-candles:
    get:
      operationId: getContinuousFuturesCandles
      tags: [Futures]
      parameters:
        - { $ref: "#/components/parameters/FuturesProductCode" }
        - { $ref: "#/components/parameters/DerivativesRange" }
        - { in: query, name: roll_method, schema: { type: string, enum: [VOLUME, OPEN_INTEREST, EXPIRY], default: OPEN_INTEREST } }
      responses:
        "200": { description: Unadjusted continuous daily series with source contract and roll metadata }
  /futures/products/{productCode}/open-interest:
    get:
      operationId: getFuturesOpenInterest
      tags: [Futures]
      parameters:
        - { $ref: "#/components/parameters/FuturesProductCode" }
        - { $ref: "#/components/parameters/TradingWindow" }
      responses:
        "200": { description: Contract open-interest history }
  /futures/products/{productCode}/institutional-positions:
    get:
      operationId: getFuturesInstitutionalPositions
      tags: [Futures]
      parameters:
        - { $ref: "#/components/parameters/FuturesProductCode" }
        - { $ref: "#/components/parameters/TradingWindow" }
      responses:
        "200":
          description: "Institutional futures volume, amount and open-interest series"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FuturesInstitutionSeriesEnvelope" }
  /futures/products/{productCode}/trader-concentration:
    get:
      operationId: getTraderConcentration
      tags: [Futures]
      parameters:
        - { $ref: "#/components/parameters/FuturesProductCode" }
        - { $ref: "#/components/parameters/TradingWindow" }
      responses:
        "200": { description: Top 5 and top 10 long/short concentration }
  /options/products/{productCode}/put-call-ratio:
    get:
      operationId: getPutCallRatio
      tags: [Futures]
      parameters:
        - { in: path, name: productCode, required: true, schema: { type: string, enum: [TXO] } }
        - { in: query, name: window, schema: { type: integer, enum: [1, 5, 10, 20, 60, 250], default: 20 } }
      responses:
        "200": { description: TXO volume and open-interest put/call ratios }
  /options/products/{productCode}/open-interest-by-strike:
    get:
      operationId: getOptionStrikeOpenInterest
      tags: [Futures]
      parameters:
        - { in: path, name: productCode, required: true, schema: { type: string, enum: [TXO] } }
        - { in: query, name: expiry, schema: { type: string } }
        - { in: query, name: date, schema: { type: string, format: date } }
      responses:
        "200": { description: TXO call and put open interest by strike }
  /options/products/{productCode}/max-pain:
    get:
      operationId: getOptionMaxPain
      tags: [Futures]
      parameters:
        - { in: path, name: productCode, required: true, schema: { type: string, enum: [TXO] } }
        - { in: query, name: expiry, schema: { type: string } }
        - { in: query, name: date, schema: { type: string, format: date } }
      responses:
        "200": { description: Derived max-pain strike with tie handling and algorithm version }
  /market/volatility:
    get:
      operationId: getMarketVolatility
      tags: [Market, Futures]
      parameters:
        - { $ref: "#/components/parameters/DerivativesRange" }
      responses:
        "200": { description: Taiwan VIX daily history and percentiles when licensed data is available }
  /securities/search:
    get:
      operationId: searchSecurities
      security: []
      tags: [Securities]
      summary: Search active TWSE and TPEx common stocks
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2 }
        - in: query
          name: market
          schema: { $ref: "#/components/schemas/MarketCode" }
        - in: query
          name: type
          schema: { $ref: "#/components/schemas/SecurityType" }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySearchEnvelope"
  /securities/{code}:
    get:
      operationId: getSecurity
      security: []
      tags: [Securities]
      summary: Get a security overview
      parameters:
        - $ref: "#/components/parameters/SecurityCode"
        - in: query
          name: market
          schema: { $ref: "#/components/schemas/MarketCode" }
      responses:
        "200":
          description: Security detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AmbiguousSecurity"
  /securities/{code}/candles:
    get:
      operationId: getSecurityCandles
      security: []
      tags: [Securities]
      summary: Get RAW or ADJUSTED daily, weekly, or monthly candles
      parameters:
        - $ref: "#/components/parameters/SecurityCode"
        - in: query
          name: market
          required: true
          schema: { $ref: "#/components/schemas/MarketCode" }
        - in: query
          name: range
          required: true
          schema:
            $ref: "#/components/schemas/ChartRange"
        - in: query
          name: interval
          required: true
          schema:
            type: string
            enum: [1d, 1w, 1mo]
        - in: query
          name: adjustment
          schema:
            type: string
            enum: [RAW, ADJUSTED]
            default: ADJUSTED
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: Candle series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandleSeriesEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /securities/{code}/technicals:
    get:
      operationId: getSecurityTechnicals
      security: []
      tags: [Securities]
      summary: Get deterministic technical indicator series
      parameters:
        - $ref: "#/components/parameters/SecurityCode"
        - in: query
          name: market
          required: true
          schema: { $ref: "#/components/schemas/MarketCode" }
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: price_basis
          schema: { $ref: "#/components/schemas/PriceBasis" }
        - in: query
          name: indicators
          description: Comma-separated indicator names
          schema: { type: string }
        - in: query
          name: ma_periods
          description: Positive, unique, comma-separated MA periods; supplying any parameter uses request-time calculation
          schema: { type: string, example: "5,10,20" }
        - in: query
          name: ema_periods
          schema: { type: string, example: "12,26" }
        - in: query
          name: rsi_period
          schema: { type: integer, minimum: 1, default: 14 }
        - in: query
          name: macd_fast
          schema: { type: integer, minimum: 1, default: 12 }
        - in: query
          name: macd_slow
          description: Must be greater than macd_fast
          schema: { type: integer, minimum: 1, default: 26 }
        - in: query
          name: macd_signal
          schema: { type: integer, minimum: 1, default: 9 }
        - in: query
          name: kd_period
          schema: { type: integer, minimum: 1, default: 9 }
        - in: query
          name: kd_k_smoothing
          schema: { type: integer, minimum: 1, default: 3 }
        - in: query
          name: kd_d_smoothing
          schema: { type: integer, minimum: 1, default: 3 }
        - in: query
          name: bollinger_period
          schema: { type: integer, minimum: 1, default: 20 }
        - in: query
          name: bollinger_stddev
          schema: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$", default: "2" }
        - in: query
          name: atr_period
          schema: { type: integer, minimum: 1, default: 14 }
        - in: query
          name: williams_period
          schema: { type: integer, minimum: 1, default: 14 }
      responses:
        "200":
          description: Technical indicator series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechnicalSeriesEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
  /securities/{code}/institutional:
    get:
      operationId: getSecurityInstitutionalSpot
      tags: [Securities]
      summary: Get spot institutional trading
      parameters:
        - $ref: "#/components/parameters/SecurityCode"
        - { in: query, name: market, required: true, schema: { $ref: "#/components/schemas/MarketCode" } }
        - in: query
          name: window
          schema:
            type: integer
            enum: [1, 5, 10, 20, 60]
            default: 20
      responses:
        "200":
          description: Institutional history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionSeriesEnvelope"
  /securities/{code}/credit:
    get:
      operationId: getSecurityCredit
      tags: [Securities]
      summary: Get margin, short and lending data
      parameters:
        - $ref: "#/components/parameters/SecurityCode"
        - { in: query, name: market, required: true, schema: { $ref: "#/components/schemas/MarketCode" } }
        - { $ref: "#/components/parameters/TradingWindow" }
      responses:
        "200":
          description: Credit trading snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditEnvelope"
  /industries:
    get:
      tags: [Industries]
      summary: List industries or themes
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [OFFICIAL, THEME]
        - in: query
          name: sort
          schema:
            type: string
            enum: [strength, cap_return, equal_return, turnover, institutional, margin]
      responses:
        "200":
          description: Industries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryListEnvelope"
  /portfolios:
    get:
      tags: [Portfolios]
      summary: List portfolios
      responses:
        "200":
          description: Portfolios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioListEnvelope"
    post:
      tags: [Portfolios]
      summary: Create a portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioEnvelope"
  /portfolios/{portfolioId}/summary:
    get:
      tags: [Portfolios]
      summary: Get portfolio summary
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummaryEnvelope"
  /portfolios/{portfolioId}/transactions:
    get:
      tags: [Portfolios]
      summary: List transactions
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListEnvelope"
    post:
      tags: [Portfolios]
      summary: Create a transaction
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
  /watchlists:
    get:
      tags: [Watchlists]
      summary: List watchlists
      responses:
        "200":
          description: Watchlists
    post:
      tags: [Watchlists]
      summary: Create a watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: Created
  /alerts:
    get:
      tags: [Alerts]
      summary: List alert rules
      responses:
        "200":
          description: Alert rules
    post:
      tags: [Alerts]
      summary: Create an alert rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleInput"
      responses:
        "201":
          description: Created
  /screeners/run:
    post:
      tags: [Screeners]
      summary: Run a stock screener
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenerRequest"
      responses:
        "200":
          description: Screener result
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SecurityCode:
      in: path
      name: code
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9.-]{2,16}$"
    TradingWindow:
      in: query
      name: window
      schema: { type: integer, enum: [1, 5, 10, 20, 60], default: 20 }
    FuturesProductCode:
      in: path
      name: productCode
      required: true
      schema: { type: string, enum: [TX, MTX, TMF, TE, TF] }
    DerivativesRange:
      in: query
      name: range
      schema: { type: string, enum: [5D, 10D, 30D, 1Y, 5Y], default: 30D }
    PortfolioId:
      in: path
      name: portfolioId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, const: ready }
        checks:
          type: object
          required: [postgres, redis]
          properties:
            postgres: { type: string, const: ok }
            redis: { type: string, const: ok }
    DataStatus:
      type: string
      enum: [LIVE, DELAYED, PRELIMINARY, FINAL, STALE, PARTIAL, UNAVAILABLE]
    MarketCode:
      type: string
      enum: [TWSE, TPEX]
    InstitutionType:
      type: string
      enum: [FOREIGN, INVESTMENT_TRUST, DEALER, TOTAL]
    SecurityType:
      type: string
      enum: [COMMON_STOCK]
    SecurityStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    Meta:
      type: object
      required: [as_of, received_at, data_status]
      properties:
        as_of: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        data_status: { $ref: "#/components/schemas/DataStatus" }
        source: { type: string }
    ChartRange:
      type: string
      enum: [1D, 5D, 10D, 30D, 1Y, 5Y]
    PriceBasis:
      type: string
      enum: [RAW, ADJUSTED]
    DecimalString:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    Quote:
      type: object
      properties:
        last: { $ref: "#/components/schemas/DecimalString" }
        change: { $ref: "#/components/schemas/DecimalString" }
        change_percent: { $ref: "#/components/schemas/DecimalString" }
        volume_shares: { type: integer, format: int64 }
    IndexSnapshot:
      type: object
      required: [code, name, quote]
      properties:
        code: { type: string }
        name: { type: string }
        quote: { $ref: "#/components/schemas/Quote" }
        turnover_amount: { $ref: "#/components/schemas/DecimalString" }
        advancers: { type: integer }
        decliners: { type: integer }
    FuturesSnapshot:
      type: object
      properties:
        product_code: { type: string }
        contract_code: { type: string }
        quote: { $ref: "#/components/schemas/Quote" }
        open_interest: { type: integer, format: int64 }
        open_interest_change: { type: integer, format: int64 }
        spot_basis: { $ref: "#/components/schemas/DecimalString" }
        expiry_date: { type: string, format: date }
    MarketOverview:
      type: object
      properties:
        indexes:
          type: array
          items: { $ref: "#/components/schemas/IndexSnapshot" }
        futures: { $ref: "#/components/schemas/FuturesSnapshot" }
        institutional_spot:
          type: array
          items: { $ref: "#/components/schemas/InstitutionSnapshot" }
        institutional_futures:
          type: array
          items: { $ref: "#/components/schemas/FuturesInstitutionSnapshot" }
        credit: { $ref: "#/components/schemas/CreditSnapshot" }
    MarketOverviewEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/MarketOverview" }
        meta: { $ref: "#/components/schemas/Meta" }
    SecuritySearchItem:
      type: object
      required: [id, code, name, market, security_type, is_active, as_of, received_at, data_status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        market: { $ref: "#/components/schemas/MarketCode" }
        security_type: { $ref: "#/components/schemas/SecurityType" }
        primary_industry: { type: [string, "null"] }
        is_active: { type: boolean }
        as_of: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        data_status: { $ref: "#/components/schemas/DataStatus" }
    SecuritySearchEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/SecuritySearchItem" }
        meta: { $ref: "#/components/schemas/Meta" }
    Security:
      type: object
      required: [id, code, name, market, security_type, status, is_active, as_of, received_at, data_status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        market: { $ref: "#/components/schemas/MarketCode" }
        security_type: { $ref: "#/components/schemas/SecurityType" }
        status: { $ref: "#/components/schemas/SecurityStatus" }
        primary_industry: { type: [string, "null"] }
        listing_date: { type: [string, "null"], format: date }
        is_active: { type: boolean }
        as_of: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        data_status: { $ref: "#/components/schemas/DataStatus" }
        source: { type: string }
    SecurityEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Security" }
        meta: { $ref: "#/components/schemas/Meta" }
    Candle:
      type: object
      required: [time, open, high, low, close, volume_shares]
      properties:
        time: { type: string, format: date-time }
        open: { $ref: "#/components/schemas/DecimalString" }
        high: { $ref: "#/components/schemas/DecimalString" }
        low: { $ref: "#/components/schemas/DecimalString" }
        close: { $ref: "#/components/schemas/DecimalString" }
        volume_shares: { type: [integer, "null"], format: int64 }
        turnover_amount:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
    CandleSeriesEnvelope:
      type: object
      required: [data, meta, interval, adjustment]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Candle" }
        meta: { $ref: "#/components/schemas/Meta" }
        interval: { type: string, enum: [1d, 1w, 1mo] }
        adjustment: { $ref: "#/components/schemas/PriceBasis" }
        display_note: { type: [string, "null"] }
    IndicatorValue:
      type: object
      required: [name, parameters, value]
      properties:
        name: { type: string }
        parameters: { type: object, additionalProperties: true }
        value:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
    TechnicalPoint:
      type: object
      required: [trade_date, price_basis, algorithm_version, indicators, as_of, data_status]
      properties:
        trade_date: { type: string, format: date }
        price_basis: { $ref: "#/components/schemas/PriceBasis" }
        algorithm_version: { type: string }
        indicators:
          type: array
          items: { $ref: "#/components/schemas/IndicatorValue" }
        as_of: { type: string, format: date-time }
        data_status: { $ref: "#/components/schemas/DataStatus" }
    TechnicalSeriesEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/TechnicalPoint" }
        meta: { $ref: "#/components/schemas/Meta" }
    InstitutionSnapshot:
      type: object
      properties:
        institution: { type: string, enum: [FOREIGN, INVESTMENT_TRUST, DEALER, TOTAL] }
        buy_amount: { $ref: "#/components/schemas/DecimalString" }
        sell_amount: { $ref: "#/components/schemas/DecimalString" }
        net_amount: { $ref: "#/components/schemas/DecimalString" }
    InstitutionSeriesEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              trade_date: { type: string, format: date }
              institutions:
                type: array
                items: { $ref: "#/components/schemas/InstitutionSnapshot" }
        meta: { $ref: "#/components/schemas/Meta" }
    FuturesInstitutionSnapshot:
      type: object
      properties:
        institution: { type: string, enum: [FOREIGN, INVESTMENT_TRUST, DEALER] }
        long_oi: { type: integer, format: int64 }
        short_oi: { type: integer, format: int64 }
        net_oi: { type: integer, format: int64 }
        net_oi_change: { type: integer, format: int64 }
    FuturesInstitutionSeriesEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              trade_date: { type: string, format: date }
              positions:
                type: array
                items: { $ref: "#/components/schemas/FuturesInstitutionSnapshot" }
        meta: { $ref: "#/components/schemas/Meta" }
    CreditSnapshot:
      type: object
      properties:
        margin_balance: { type: integer, format: int64 }
        margin_change: { type: integer, format: int64 }
        short_balance: { type: integer, format: int64 }
        short_change: { type: integer, format: int64 }
        lending_balance: { type: integer, format: int64 }
        lending_change: { type: integer, format: int64 }
        short_margin_ratio: { $ref: "#/components/schemas/DecimalString" }
    CreditEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/CreditSnapshot" }
        meta: { $ref: "#/components/schemas/Meta" }
    FuturesOverviewEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/FuturesSnapshot" }
        meta: { $ref: "#/components/schemas/Meta" }
    IndustryItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [OFFICIAL, THEME] }
        strength_score: { $ref: "#/components/schemas/DecimalString" }
        cap_weight_return: { $ref: "#/components/schemas/DecimalString" }
        equal_weight_return: { $ref: "#/components/schemas/DecimalString" }
    IndustryListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/IndustryItem" }
        meta: { $ref: "#/components/schemas/Meta" }
    Portfolio:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        is_default: { type: boolean }
    CreatePortfolioRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    PortfolioEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Portfolio" }
    PortfolioListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Portfolio" }
    PortfolioSummary:
      type: object
      properties:
        market_value: { $ref: "#/components/schemas/DecimalString" }
        cost_basis: { $ref: "#/components/schemas/DecimalString" }
        realized_pnl: { $ref: "#/components/schemas/DecimalString" }
        unrealized_pnl: { $ref: "#/components/schemas/DecimalString" }
        return_percent: { $ref: "#/components/schemas/DecimalString" }
        valuation_as_of: { type: string, format: date-time }
    PortfolioSummaryEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/PortfolioSummary" }
        meta: { $ref: "#/components/schemas/Meta" }
    TransactionInput:
      type: object
      additionalProperties: false
      required:
        - stock_code
        - transaction_type
        - transaction_time
        - quantity_shares
        - price
        - fee
        - lot_type
      properties:
        stock_code:
          type: string
        transaction_type:
          type: string
          enum: [BUY, SELL]
        transaction_time:
          type: string
          format: date-time
        quantity_shares:
          type: integer
          minimum: 1
        price:
          $ref: "#/components/schemas/DecimalString"
        fee:
          $ref: "#/components/schemas/DecimalString"
        lot_type:
          type: string
          enum: [BOARD_LOT, ODD_LOT]
    Transaction:
      allOf:
        - $ref: "#/components/schemas/TransactionInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            portfolio_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
    TransactionEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Transaction" }
    TransactionListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
    AlertRuleInput:
      type: object
      required: [target_type, target_id, rule_type, parameters]
      properties:
        target_type: { type: string }
        target_id: { type: string }
        rule_type: { type: string }
        parameters: { type: object, additionalProperties: true }
        cooldown_minutes: { type: integer, minimum: 0, default: 120 }
        daily_limit: { type: integer, minimum: 1, default: 2 }
        is_enabled: { type: boolean, default: true }
    ScreenerRequest:
      type: object
      required: [expression]
      properties:
        expression:
          type: object
          additionalProperties: true
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
    ErrorDetail:
      type: object
      required: [code, message, details, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        request_id: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    AmbiguousSecurity:
      description: Security code exists in more than one market
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationError:
      description: Validation failed
