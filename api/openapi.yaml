openapi: 3.1.0
info:
  title: TW Market Ledger API
  version: 0.1.0
  description: Contract baseline for the Taiwan stock portfolio and market intelligence app.
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Sync
  - name: Market
  - name: Securities
  - name: Futures
  - name: Industries
  - name: Portfolios
  - name: Watchlists
  - name: Alerts
  - name: Screeners
paths:
  /auth/register:
    post:
      security: []
      tags: [Auth]
      operationId: registerAccount
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthCredentials" } } } }
      responses: { "201": { description: Account created } }
  /auth/login:
    post:
      security: []
      tags: [Auth]
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthCredentials" } } } }
      responses: { "200": { description: Rotating session tokens, content: { application/json: { schema: { $ref: "#/components/schemas/AuthTokenEnvelope" } } } }, "401": { description: Unauthenticated } }
  /auth/refresh:
    post:
      security: []
      tags: [Auth]
      operationId: refreshSession
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshTokenInput" } } } }
      responses: { "200": { description: Rotated tokens, content: { application/json: { schema: { $ref: "#/components/schemas/AuthTokenEnvelope" } } } }, "401": { description: Unauthenticated } }
  /auth/logout:
    post:
      security: []
      tags: [Auth]
      operationId: logout
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshTokenInput" } } } }
      responses: { "204": { description: Session revoked } }
  /me:
    get:
      tags: [Auth]
      operationId: getCurrentAccount
      responses: { "200": { description: Current account } }
  /devices:
    post:
      tags: [Auth]
      operationId: registerDevice
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceInput" } } } }
      responses: { "200": { description: Stable device registration } }
  /sync/push:
    post:
      tags: [Sync]
      operationId: pushSyncOperations
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncPushInput" } } } }
      responses: { "200": { description: "Per-operation accepted, duplicate, conflict, or rejected status" }, "403": { description: Device is outside authenticated user scope } }
  /sync/changes:
    get:
      tags: [Sync]
      operationId: getSyncChanges
      parameters:
        - { in: query, name: cursor, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses: { "200": { description: Bounded incremental user-scoped changes } }
  /sync/bootstrap:
    get:
      tags: [Sync]
      operationId: bootstrapSync
      responses: { "200": { description: Current user watchlist snapshot and cursor } }
  /realtime/markets:
    get:
      operationId: getRealtimeMarkets
      tags: [Market]
      responses:
        "200":
          description: Realtime TWSE and TPEx breadth snapshots
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RealtimeMarketSnapshot" } } } }
  /realtime/markets/{market}:
    get:
      operationId: getRealtimeMarket
      tags: [Market]
      parameters: [{ in: path, name: market, required: true, schema: { type: string } }]
      responses:
        "200": { description: Realtime market breadth, content: { application/json: { schema: { $ref: "#/components/schemas/RealtimeMarketSnapshot" } } } }
  /realtime/industries/strength:
    get:
      operationId: getRealtimeIndustryStrengths
      tags: [Industries]
      parameters:
        - { in: query, name: sort, schema: { type: string, enum: [strength, return, breadth, turnover], default: strength } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: Realtime industry ranking, content: { application/json: { schema: { $ref: "#/components/schemas/RealtimeTaxonomyRanking" } } } }
  /realtime/themes/strength:
    get:
      operationId: getRealtimeThemeStrengths
      tags: [Industries]
      parameters:
        - { in: query, name: sort, schema: { type: string, enum: [strength, return, breadth, turnover], default: strength } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: Realtime theme ranking, content: { application/json: { schema: { $ref: "#/components/schemas/RealtimeTaxonomyRanking" } } } }
  /realtime/industries/{taxonomyId}/strength:
    get:
      operationId: getRealtimeIndustryStrength
      tags: [Industries]
      parameters: [{ in: path, name: taxonomyId, required: true, schema: { type: string } }]
      responses:
        "200": { description: Realtime industry detail, content: { application/json: { schema: { $ref: "#/components/schemas/RealtimeTaxonomySnapshot" } } } }
  /realtime/themes/{taxonomyId}/strength:
    get:
      operationId: getRealtimeThemeStrength
      tags: [Industries]
      parameters: [{ in: path, name: taxonomyId, required: true, schema: { type: string } }]
      responses:
        "200": { description: Realtime theme detail, content: { application/json: { schema: { $ref: "#/components/schemas/RealtimeTaxonomySnapshot" } } } }
  /intraday/{market}/{code}/candles:
    get:
      operationId: getIntradayCandles
      tags: [Market]
      summary: Get short-retention intraday candles
      parameters:
        - { in: path, name: market, required: true, schema: { type: string } }
        - { in: path, name: code, required: true, schema: { type: string } }
        - { in: query, name: interval, schema: { $ref: "#/components/schemas/IntradayInterval" } }
        - { in: query, name: date, schema: { type: string, format: date } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        "200":
          description: Chronological intraday candle history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntradayCandleEnvelope" }
        "422": { description: Invalid interval or query }
  /health:
    get:
      security: []
      summary: Liveness check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      security: []
      summary: Dependency readiness check
      responses:
        "200":
          description: PostgreSQL and Redis are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /market/overview:
    get:
      tags: [Market]
      summary: Get the market dashboard snapshot
      responses:
        "200":
          description: Market overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketOverviewEnvelope"
  /market/indexes:
    get:
      operationId: getMarketIndexes
      tags: [Market]
      responses:
        "200": { description: Latest TAIEX and OTC index records }
  /market/indexes/{indexCode}:
    get:
      operationId: getMarketIndex
      tags: [Market]
      parameters:
        - { in: path, name: indexCode, required: true, schema: { type: string } }
      responses:
        "200": { description: Latest market index }
        "404": { $ref: "#/components/responses/NotFound" }
  /market/indexes/{indexCode}/candles:
    get:
      operationId: getMarketIndexCandles
      tags: [Market]
      parameters:
        - { in: path, name: indexCode, required: true, schema: { type: string } }
        - { in: query, name: range, schema: { type: string, enum: [5D, 10D, 30D, 1Y, 5Y], default: 30D } }
      responses:
        "200": { description: Daily index candles }
  /market/breadth:
    get:
      operationId: getMarketBreadth
      tags: [Market]
      parameters:
        - { in: query, name: market, schema: { $ref: "#/components/schemas/MarketCode" } }
        - { in: query, name: date, schema: { type: string, format: date } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        "200": { description: Market breadth series }
  /market/institutional/spot:
    get:
      operationId: getMarketInstitutionalSpot
      tags: [Market]
      parameters:
        - { in: query, name: market, required: true, schema: { $ref: "#/components/schemas/MarketCode" } }
        - { $ref: "#/components/parameters/TradingWindow" }
        - { in: query, name: institution, schema: { $ref: "#/components/schemas/InstitutionType" } }
      responses:
        "200": { description: Market institutional spot series }
  /market/credit:
    get:
      operationId: getMarketCredit
      tags: [Market]
      parameters:
        - { in: query, name: market, required: true, schema: { $ref: "#/components/schemas/MarketCode" } }
        - { $ref: "#/components/parameters/TradingWindow" }
      responses:
        "200": { description: "Market margin, short and lending series" }
  /futures/products:
    get:
      operationId: getFuturesProducts
      tags: [Futures]
      responses:
        "200": { description: Supported TAIFEX futures products }
  /futures/products/{productCode}/overview:
    get:
      operationId: getFuturesOverview
      tags: [Futures]
      parameters:
        - { $ref: "#/components/parameters/FuturesProductCode" }
      responses:
        "200":
          description: Near and next contract overview with basis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FuturesOverviewEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /futures/products/{productCode}/contracts:
    get:
      operationId: getFuturesContracts
      tags: [Futures]
      parameters:
        - { $ref: "#/components/parameters/FuturesProductCode" }
      responses:
        "200": { description: Actual delivery-month contracts }
  /futures/contracts/{contractCode}/candles:
    get:
      operationId: getFuturesContractCandles
      tags: [Futures]
      parameters:
        - { in: path, name: contractCode, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/DerivativesRange" }
      responses:
        "200": { description: "Contract daily OHLC, volume and open interest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /futures/products/{productCode}/continuous-candles:
    get:
      operationId: getContinuousFuturesCandles
      tags: [Futures]
      parameters:
        - { $ref: "#/components/parameters/FuturesProductCode" }
        - { $ref: "#/components/parameters/DerivativesRange" }
        - { in: query, name: roll_method, schema: { type: string, enum: [VOLUME, OPEN_INTEREST, EXPIRY], default: OPEN_INTEREST } }
      responses:
        "200": { description: Unadjusted continuous daily series with source contract and roll metadata }
  /futures/products/{productCode}/open-interest:
    get:
      operationId: getFuturesOpenInterest
      tags: [Futures]
      parameters:
        - { $ref: "#/components/parameters/FuturesProductCode" }
        - { $ref: "#/components/parameters/TradingWindow" }
      responses:
        "200": { description: Contract open-interest history }
  /futures/products/{productCode}/institutional-positions:
    get:
      operationId: getFuturesInstitutionalPositions
      tags: [Futures]
      parameters:
        - { $ref: "#/components/parameters/FuturesProductCode" }
        - { $ref: "#/components/parameters/TradingWindow" }
      responses:
        "200":
          description: "Institutional futures volume, amount and open-interest series"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FuturesInstitutionSeriesEnvelope" }
  /futures/products/{productCode}/trader-concentration:
    get:
      operationId: getTraderConcentration
      tags: [Futures]
      parameters:
        - { $ref: "#/components/parameters/FuturesProductCode" }
        - { $ref: "#/components/parameters/TradingWindow" }
      responses:
        "200": { description: Top 5 and top 10 long/short concentration }
  /options/products/{productCode}/put-call-ratio:
    get:
      operationId: getPutCallRatio
      tags: [Futures]
      parameters:
        - { in: path, name: productCode, required: true, schema: { type: string, enum: [TXO] } }
        - { in: query, name: window, schema: { type: integer, enum: [1, 5, 10, 20, 60, 250], default: 20 } }
      responses:
        "200": { description: TXO volume and open-interest put/call ratios }
  /options/products/{productCode}/open-interest-by-strike:
    get:
      operationId: getOptionStrikeOpenInterest
      tags: [Futures]
      parameters:
        - { in: path, name: productCode, required: true, schema: { type: string, enum: [TXO] } }
        - { in: query, name: expiry, schema: { type: string } }
        - { in: query, name: date, schema: { type: string, format: date } }
      responses:
        "200": { description: TXO call and put open interest by strike }
  /options/products/{productCode}/max-pain:
    get:
      operationId: getOptionMaxPain
      tags: [Futures]
      parameters:
        - { in: path, name: productCode, required: true, schema: { type: string, enum: [TXO] } }
        - { in: query, name: expiry, schema: { type: string } }
        - { in: query, name: date, schema: { type: string, format: date } }
      responses:
        "200": { description: Derived max-pain strike with tie handling and algorithm version }
  /market/volatility:
    get:
      operationId: getMarketVolatility
      tags: [Market, Futures]
      parameters:
        - { $ref: "#/components/parameters/DerivativesRange" }
      responses:
        "200": { description: Taiwan VIX daily history and percentiles when licensed data is available }
  /securities/search:
    get:
      operationId: searchSecurities
      security: []
      tags: [Securities]
      summary: Search active TWSE and TPEx common stocks
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2 }
        - in: query
          name: market
          schema: { $ref: "#/components/schemas/MarketCode" }
        - in: query
          name: type
          schema: { $ref: "#/components/schemas/SecurityType" }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySearchEnvelope"
  /securities/{code}:
    get:
      operationId: getSecurity
      security: []
      tags: [Securities]
      summary: Get a security overview
      parameters:
        - $ref: "#/components/parameters/SecurityCode"
        - in: query
          name: market
          schema: { $ref: "#/components/schemas/MarketCode" }
      responses:
        "200":
          description: Security detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AmbiguousSecurity"
  /securities/{code}/candles:
    get:
      operationId: getSecurityCandles
      security: []
      tags: [Securities]
      summary: Get RAW or ADJUSTED daily, weekly, or monthly candles
      parameters:
        - $ref: "#/components/parameters/SecurityCode"
        - in: query
          name: market
          required: true
          schema: { $ref: "#/components/schemas/MarketCode" }
        - in: query
          name: range
          required: true
          schema:
            $ref: "#/components/schemas/ChartRange"
        - in: query
          name: interval
          required: true
          schema:
            type: string
            enum: [1d, 1w, 1mo]
        - in: query
          name: adjustment
          schema:
            type: string
            enum: [RAW, ADJUSTED]
            default: ADJUSTED
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: Candle series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandleSeriesEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /securities/{code}/technicals:
    get:
      operationId: getSecurityTechnicals
      security: []
      tags: [Securities]
      summary: Get deterministic technical indicator series
      parameters:
        - $ref: "#/components/parameters/SecurityCode"
        - in: query
          name: market
          required: true
          schema: { $ref: "#/components/schemas/MarketCode" }
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: price_basis
          schema: { $ref: "#/components/schemas/PriceBasis" }
        - in: query
          name: indicators
          description: Comma-separated indicator names
          schema: { type: string }
        - in: query
          name: ma_periods
          description: Positive, unique, comma-separated MA periods; supplying any parameter uses request-time calculation
          schema: { type: string, example: "5,10,20" }
        - in: query
          name: ema_periods
          schema: { type: string, example: "12,26" }
        - in: query
          name: rsi_period
          schema: { type: integer, minimum: 1, default: 14 }
        - in: query
          name: macd_fast
          schema: { type: integer, minimum: 1, default: 12 }
        - in: query
          name: macd_slow
          description: Must be greater than macd_fast
          schema: { type: integer, minimum: 1, default: 26 }
        - in: query
          name: macd_signal
          schema: { type: integer, minimum: 1, default: 9 }
        - in: query
          name: kd_period
          schema: { type: integer, minimum: 1, default: 9 }
        - in: query
          name: kd_k_smoothing
          schema: { type: integer, minimum: 1, default: 3 }
        - in: query
          name: kd_d_smoothing
          schema: { type: integer, minimum: 1, default: 3 }
        - in: query
          name: bollinger_period
          schema: { type: integer, minimum: 1, default: 20 }
        - in: query
          name: bollinger_stddev
          schema: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$", default: "2" }
        - in: query
          name: atr_period
          schema: { type: integer, minimum: 1, default: 14 }
        - in: query
          name: williams_period
          schema: { type: integer, minimum: 1, default: 14 }
      responses:
        "200":
          description: Technical indicator series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechnicalSeriesEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
  /securities/{code}/institutional:
    get:
      operationId: getSecurityInstitutionalSpot
      tags: [Securities]
      summary: Get spot institutional trading
      parameters:
        - $ref: "#/components/parameters/SecurityCode"
        - { in: query, name: market, required: true, schema: { $ref: "#/components/schemas/MarketCode" } }
        - in: query
          name: window
          schema:
            type: integer
            enum: [1, 5, 10, 20, 60]
            default: 20
      responses:
        "200":
          description: Institutional history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionSeriesEnvelope"
  /securities/{code}/credit:
    get:
      operationId: getSecurityCredit
      tags: [Securities]
      summary: Get margin, short and lending data
      parameters:
        - $ref: "#/components/parameters/SecurityCode"
        - { in: query, name: market, required: true, schema: { $ref: "#/components/schemas/MarketCode" } }
        - { $ref: "#/components/parameters/TradingWindow" }
      responses:
        "200":
          description: Credit trading snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditEnvelope"
  /industries:
    get:
      operationId: listIndustries
      tags: [Industries]
      summary: List official industries
      responses:
        "200":
          description: List of industries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndustryListEnvelope" }
  /industries/{id}:
    get:
      operationId: getIndustry
      tags: [Industries]
      summary: Get industry detail
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Industry detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndustryEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /industries/{id}/securities:
    get:
      operationId: getIndustrySecurities
      tags: [Industries]
      summary: Get member securities of an industry
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Member securities with price overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndustrySecuritiesEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /industries/strength:
    get:
      operationId: listIndustryStrengths
      tags: [Industries]
      summary: List industry strength ranking snapshots
      parameters:
        - { in: query, name: window, required: false, schema: { type: integer, default: 20 } }
        - { in: query, name: trade_date, required: false, schema: { type: string, format: date } }
        - { in: query, name: sort, required: false, schema: { type: string, default: "strength" } }
      responses:
        "200":
          description: Industry strength snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyStrengthListEnvelope" }
  /industries/{id}/strength:
    get:
      operationId: getIndustryStrengthDetail
      tags: [Industries]
      summary: Get industry strength detail with leaders and laggards
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: window, required: false, schema: { type: integer, default: 20 } }
        - { in: query, name: trade_date, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: Industry strength detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyStrengthDetailEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /industries/{id}/strength/history:
    get:
      operationId: getIndustryStrengthHistory
      tags: [Industries]
      summary: Get industry strength historical snapshots
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: window, required: false, schema: { type: integer, default: 20 } }
        - { in: query, name: limit, required: false, schema: { type: integer, default: 60 } }
      responses:
        "200":
          description: Industry strength history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyStrengthListEnvelope" }
  /themes:
    get:
      operationId: listThemes
      tags: [Themes]
      summary: List themes
      responses:
        "200":
          description: List of themes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemeListEnvelope" }
    post:
      operationId: createTheme
      tags: [Themes]
      summary: Create a custom theme
      parameters:
        - { in: header, name: X-Admin-Key, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateThemeInput" }
      responses:
        "201":
          description: Theme created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemeEnvelope" }
  /themes/{id}:
    get:
      operationId: getTheme
      tags: [Themes]
      summary: Get theme detail
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Theme detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemeEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateTheme
      tags: [Themes]
      summary: Update a custom theme
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Admin-Key, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
