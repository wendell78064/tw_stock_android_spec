            application/json:
              schema: { $ref: "#/components/schemas/ScreenerResultEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SecurityCode:
      in: path
      name: code
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9.-]{2,16}$"
    TradingWindow:
      in: query
      name: window
      schema: { type: integer, enum: [1, 5, 10, 20, 60], default: 20 }
    FuturesProductCode:
      in: path
      name: productCode
      required: true
      schema: { type: string, enum: [TX, MTX, TMF, TE, TF] }
    DerivativesRange:
      in: query
      name: range
      schema: { type: string, enum: [5D, 10D, 30D, 1Y, 5Y], default: 30D }
    PortfolioId:
      in: path
      name: portfolioId
      required: true
      schema:
        type: string
        format: uuid
    WatchlistId:
      in: path
      name: watchlistId
      required: true
      schema: { type: string, format: uuid }
  schemas:
    AuthCredentials:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 1, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 256, format: password, writeOnly: true }
    RefreshTokenInput:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 32, writeOnly: true }
    AuthTokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string, writeOnly: true }
        refresh_token: { type: string, writeOnly: true }
        token_type: { type: string, enum: [bearer] }
        expires_in: { type: integer }
    AuthTokenEnvelope:
      type: object
      required: [data]
      properties: { data: { $ref: "#/components/schemas/AuthTokens" } }
    DeviceInput:
      type: object
      required: [device_public_id, platform]
      properties:
        device_public_id: { type: string, minLength: 16, maxLength: 128 }
        name: { type: [string, "null"] }
        platform: { type: string }
        app_version: { type: [string, "null"] }
    SyncOperationInput:
      type: object
      required: [operation_id, entity_type, entity_id, operation, base_version]
      properties:
        operation_id: { type: string, format: uuid }
        entity_type: { type: string, enum: [WATCHLIST, WATCHLIST_ITEM] }
        entity_id: { type: string, format: uuid }
        operation: { type: string, enum: [UPSERT, DELETE] }
        base_version: { type: integer, minimum: 0 }
        payload: { type: [object, "null"], additionalProperties: true }
    SyncPushInput:
      type: object
      required: [device_id, operations]
      properties:
        device_id: { type: string, format: uuid }
        operations: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/SyncOperationInput" } }
    RealtimeMarketSnapshot:
      type: object
      required: [market_id, as_of, exchange_timestamp, total_members, valid_members, quoted_members, coverage_ratio, advancers, decliners, unchanged, advance_ratio, decline_ratio, live_count, stale_count, unavailable_count, data_status, provider, source_type, algorithm_version]
      properties:
        market_id: { type: string }
        as_of: { type: string, format: date-time }
        exchange_timestamp: { type: string, format: date-time }
        total_members: { type: integer }
        valid_members: { type: integer }
        quoted_members: { type: integer }
        coverage_ratio: { $ref: "#/components/schemas/DecimalString" }
        advancers: { type: integer }
        decliners: { type: integer }
        unchanged: { type: integer }
        advance_ratio: { $ref: "#/components/schemas/DecimalString" }
        decline_ratio: { $ref: "#/components/schemas/DecimalString" }
        turnover_amount: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        live_count: { type: integer }
        stale_count: { type: integer }
        unavailable_count: { type: integer }
        data_status: { type: string }
        provider: { type: string }
        source_type: { type: string }
        algorithm_version: { type: string }
    RealtimeStrengthComponents:
      type: object
      properties:
        momentum: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        breadth: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        technical: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        turnover: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
    RealtimeTaxonomySnapshot:
      type: object
      required: [taxonomy_type, taxonomy_id, code, name, as_of, total_members, valid_members, quoted_members, coverage_ratio, advancers, decliners, unchanged, components, component_coverage, leaders, laggards, data_status, provider, source_type, algorithm_version]
      properties:
        taxonomy_type: { type: string, enum: [INDUSTRY, THEME] }
        taxonomy_id: { type: string }
        code: { type: string }
        name: { type: string }
        as_of: { type: string, format: date-time }
        total_members: { type: integer }
        valid_members: { type: integer }
        quoted_members: { type: integer }
        coverage_ratio: { $ref: "#/components/schemas/DecimalString" }
        equal_weight_return: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        advancers: { type: integer }
        decliners: { type: integer }
        unchanged: { type: integer }
        advance_ratio: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        turnover_amount: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        turnover_share: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        above_ma20_pct_realtime: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        above_ma60_pct_realtime: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        components: { $ref: "#/components/schemas/RealtimeStrengthComponents" }
        realtime_strength_score: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        component_coverage: { $ref: "#/components/schemas/DecimalString" }
        rank: { type: [integer, "null"] }
        leaders: { type: array, items: { type: object, additionalProperties: true } }
        laggards: { type: array, items: { type: object, additionalProperties: true } }
        data_status: { type: string }
        provider: { type: string }
