[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tw-market-ledger-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "asyncpg==0.30.0",
  "fastapi==0.116.1",
  "pydantic-settings==2.10.1",
  "redis==6.2.0",
  "sqlalchemy[asyncio]==2.0.42",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
  "httpx==0.28.1",
  "argon2-cffi==25.1.0",
  "PyJWT==2.10.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "psycopg2-binary==2.9.10",
  "ruff==0.12.7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
